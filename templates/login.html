{% extends "base.html" %}
{% block title %}Login — Sole Store{% endblock %}

{% block extra_head %}
<style>
  .auth-wrapper {
    min-height: calc(100vh - 64px);
    background: var(--black);
    display: grid; grid-template-columns: 1fr 1fr;
  }
  .auth-visual {
    position: relative; overflow: hidden;
  }
  .auth-visual img {
    width: 100%; height: 100%; object-fit: cover; opacity: .5;
  }
  .auth-visual-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 3rem;
  }
  .auth-visual-title {
    font-family: var(--font-display);
    font-size: 4rem; letter-spacing: 2px; color: var(--white);
    line-height: 1;
  }
  .auth-visual-title span { color: var(--accent); }
  .auth-visual-sub { color: rgba(255,255,255,.6); margin-top: .5rem; font-size: 1rem; }

  .auth-form-side {
    display: flex; align-items: center; justify-content: center;
    padding: 3rem 2rem;
  }
  .auth-box {
    width: 100%; max-width: 420px;
    background: var(--white); border-radius: var(--radius);
    padding: 2.5rem;
  }
  .auth-title { font-family: var(--font-display); font-size: 2rem; letter-spacing: 1px; margin-bottom: .25rem; }
  .auth-sub { font-size: .875rem; color: var(--gray); margin-bottom: 2rem; }
  .auth-sub a { font-weight: 700; color: var(--black); }

  @media (max-width: 768px) {
    .auth-wrapper { grid-template-columns: 1fr; }
    .auth-visual { display: none; }
  }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-visual">
    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=900" alt="Shoes"/>
    <div class="auth-visual-overlay">
      <div class="auth-visual-title">WELCOME<br>BACK TO <span>SOLE.</span></div>
      <div class="auth-visual-sub">Your next great pair is waiting.</div>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-box">
      <h1 class="auth-title">SIGN IN</h1>
      <p class="auth-sub">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>

      <form action="{{ url_for('auth.login') }}" method="POST">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" required autofocus placeholder="you@email.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary w-full" style="margin-top:.5rem;">Sign In →</button>
      </form>

      <p style="text-align:center; font-size:.8rem; color:var(--gray); margin-top:1.5rem;">
        By signing in you agree to our <a href="#" style="color:var(--black);">Terms</a> &amp; <a href="#" style="color:var(--black);">Privacy Policy</a>.
      </p>
    </div>
  </div>
</div>
{% endblock %}
